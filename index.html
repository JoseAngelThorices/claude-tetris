<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle">
      <span class="toggle-icon">&#9790;</span>
      <span class="toggle-label">LIGHT</span>
    </button>
    <select id="skin-select" class="skin-select" aria-label="Skin">
      <option value="retro">Retro</option>
      <option value="neon">Neon</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>Esc</kbd> menú</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box records-box">
        <p class="records-title">RÉCORDS</p>
        <div id="start-records" class="records"></div>
        <button id="play-btn">Jugar</button>
        <p class="records-hint">o pulsa <kbd>Enter</kbd></p>
        <button id="reset-records-btn">Borrar récords</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="record-message" class="record-message hidden"></p>
        <div id="name-form" class="name-form hidden">
          <label for="player-name">Tu nombre</label>
          <div class="name-row">
            <input id="player-name" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Anónimo" />
            <button id="save-name-btn">Guardar</button>
          </div>
        </div>
        <div id="gameover-records" class="records hidden"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title" class="pause-title">PAUSA</p>
        <button id="resume-btn" class="pause-btn">Reanudar</button>
        <button id="pause-restart-btn" class="pause-btn pause-btn-secondary">Reiniciar</button>
        <button id="controls-btn" class="pause-btn pause-btn-secondary" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
          <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
          <li><span><kbd>↓</kbd></span> bajar</li>
          <li><span><kbd>Espacio</kbd></span> caída</li>
          <li><span><kbd>P</kbd><kbd>Esc</kbd></span> menú</li>
        </ul>
        <label class="pause-level" for="start-level">
          <span>Nivel inicial</span>
          <select id="start-level">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>
        <p class="pause-hint">Se aplica en la próxima partida</p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
